name: Update formulas

# Every day, bump the formulas whose project has a newer release tag. Each
# bump is built from source, tested and audited before it is committed.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-formulas

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Checks out this repository as the tap, in the workspace.
      - uses: Homebrew/actions/setup-homebrew@main

      - name: Bump, build and test
        id: bump
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bumps=$(.github/scripts/update-formulas.sh byjg/tap)
          echo "$bumps"
          {
            echo "bumps<<EOF"
            echo "$bumps"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.bump.outputs.bumps != ''
        env:
          BUMPS: ${{ steps.bump.outputs.bumps }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          git commit -m "Update formulas" -m "$BUMPS"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD
